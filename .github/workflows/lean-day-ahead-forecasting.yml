name: Forecasting and market impact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Part II, Ch. 5 (forecasting and market impact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: >-
            --wfail
            Thesis.DayAhead.ForecastingImpact.AttributionVersions
            Thesis.DayAhead.ForecastingImpact.BoostingLoss
            Thesis.DayAhead.ForecastingImpact.ConditionalDecoding
            Thesis.DayAhead.ForecastingImpact.ConditionalSimulation
            Thesis.DayAhead.ForecastingImpact.EmpiricalGeometry
            Thesis.DayAhead.ForecastingImpact.Forecasting
            Thesis.DayAhead.ForecastingImpact.GreedyBoosting
            Thesis.DayAhead.ForecastingImpact.GreedyTree
            Thesis.DayAhead.ForecastingImpact.LiftedPriceScale
            Thesis.DayAhead.ForecastingImpact.LowRankGram
            Thesis.DayAhead.ForecastingImpact.RecursiveTrees
            Thesis.DayAhead.ForecastingImpact.RidgeForecast
            Thesis.DayAhead.ForecastingImpact.SAGE
            Thesis.DayAhead.ForecastingImpact.Shapley
            Thesis.DayAhead.ForecastingImpact.ShapleyPermutations
            Thesis.DayAhead.ForecastingImpact.ShapleySampling
            Thesis.DayAhead.ForecastingImpact.ShapleyWeights
            Thesis.DayAhead.ForecastingImpact.SpectralSplitBound
            Thesis.DayAhead.ForecastingImpact.TreeImpurity
