name: Intraday applications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Part III, Ch. 5 (applications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: >-
            --wfail
            Thesis.Intraday.Applications.Mandate
            Thesis.Intraday.Applications.MandateGaussian
