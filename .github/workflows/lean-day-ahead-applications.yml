name: Day-ahead applications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Part II, Ch. 6 (applications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: >-
            --wfail
            Thesis.DayAhead.Applications.BatteryControl
            Thesis.DayAhead.Applications.BatterySourceScope
            Thesis.DayAhead.Applications.BatteryValuation
            Thesis.DayAhead.Applications.RenewablePayoff
