name: Lean Market Clearing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build market clearing section
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: --wfail Foundations.MarketClearing.Selection Foundations.MarketClearing.Sorting Foundations.MarketClearing.Equilibrium
